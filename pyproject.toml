[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastqoptifilter"
description = "Quality-aware, FDR-controlled optical and proximity duplicate filtering for paired-end Illumina FASTQ files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Set by SciPy, not by the language. The source itself parses under 3.10,
# but no scipy >= 1.17 exists for 3.10, so pip cannot resolve there.
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Yaping Liu", email = "lyping1986@gmail.com" }]
maintainers = [{ name = "Yaping Liu", email = "lyping1986@gmail.com" }]
keywords = [
    "bioinformatics",
    "sequencing",
    "illumina",
    "fastq",
    "optical-duplicates",
    "pcr-duplicates",
    "library-complexity",
    "cfdna",
    "flowcell",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# scipy >= 1.17 is a hard floor: FastqOptiFilter uses scipy.stats.poisson_binom,
# which does not exist earlier. An older scipy fails at import rather than
# reporting a version problem. scipy 1.17 in turn requires Python >= 3.11,
# which is what sets requires-python above.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.17",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/epifluidlab/FastqOptiFilter"
Repository = "https://github.com/epifluidlab/FastqOptiFilter"
Issues = "https://github.com/epifluidlab/FastqOptiFilter/issues"
Archive = "https://doi.org/10.5281/zenodo.22307671"

[project.scripts]
fastqoptifilter = "fastq_optifilter:main"

[tool.setuptools]
# A single top-level module rather than a package, so that
# `python3 fastq_optifilter.py` keeps working from a clone.
py-modules = ["fastq_optifilter"]

[tool.setuptools.dynamic]
version = { attr = "fastq_optifilter.VERSION" }

[tool.setuptools.packages.find]
# Nothing to discover; the distribution is one module plus its console script.
where = []
